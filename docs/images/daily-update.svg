<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="t2"><style>
:root {
  color-scheme: light;
  --bg:#FAF9F5; --surface:#FFFFFF; --border:#B4B2A9; --text:#2C2C2A; --muted:#5F5E5A; --line:#888780;
  --teal-bg:#E1F5EE; --teal-line:#0F6E56; --teal-title:#085041; --teal-sub:#0F6E56;
  --coral-bg:#FAECE7; --coral-line:#993C1D; --coral-title:#712B13; --coral-sub:#993C1D;
  --purple-bg:#EEEDFE; --purple-line:#534AB7; --purple-title:#3C3489; --purple-sub:#534AB7;
  --amber-bg:#FAEEDA; --amber-line:#854F0B; --amber-title:#633806; --amber-sub:#854F0B;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg:#1F1E1D; --surface:#2C2C2A; --border:#5F5E5A; --text:#F1EFE8; --muted:#B4B2A9; --line:#888780;
    --teal-bg:#085041; --teal-line:#5DCAA5; --teal-title:#E1F5EE; --teal-sub:#9FE1CB;
    --coral-bg:#712B13; --coral-line:#F0997B; --coral-title:#FAECE7; --coral-sub:#F5C4B3;
    --purple-bg:#3C3489; --purple-line:#AFA9EC; --purple-title:#EEEDFE; --purple-sub:#CECBF6;
    --amber-bg:#633806; --amber-line:#EF9F27; --amber-title:#FAEEDA; --amber-sub:#FAC775;
  }
}
.th { font-size:14px; font-weight:500; fill:var(--text); }
.ts { font-size:12px; fill:var(--muted); }
.box rect { fill:var(--surface); stroke:var(--border); stroke-width:.8; }
.frame { fill:none; stroke:var(--border); stroke-width:1; stroke-dasharray:5 4; }
.arr { stroke:var(--line); stroke-width:1.2; fill:none; }
marker path { stroke:var(--line); }
.teal rect { fill:var(--teal-bg); stroke:var(--teal-line); stroke-width:.8; } .teal .th { fill:var(--teal-title); } .teal .ts { fill:var(--teal-sub); }
.coral rect { fill:var(--coral-bg); stroke:var(--coral-line); stroke-width:.8; } .coral .th { fill:var(--coral-title); } .coral .ts { fill:var(--coral-sub); }
.purple rect { fill:var(--purple-bg); stroke:var(--purple-line); stroke-width:.8; } .purple .th { fill:var(--purple-title); } .purple .ts { fill:var(--purple-sub); }
.amber rect { fill:var(--amber-bg); stroke:var(--amber-line); stroke-width:.8; } .amber .th { fill:var(--amber-title); } .amber .ts { fill:var(--amber-sub); }
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: var(--bg); }
</style><rect class="bg" width="100%" height="100%"/><title id="t2">Daily update</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="purple"><rect x="190" y="30" width="300" height="56" rx="8"/><text class="th" x="340.0" y="47" text-anchor="middle" dominant-baseline="central">1. Collect lessons</text><text class="ts" x="340.0" y="65" text-anchor="middle" dominant-baseline="central">From all your projects</text></g><line class="arr" x1="340" y1="86" x2="340" y2="113" marker-end="url(#a)"/><g class="purple"><rect x="190" y="116" width="300" height="56" rx="8"/><text class="th" x="340.0" y="133" text-anchor="middle" dominant-baseline="central">2. Score them</text><text class="ts" x="340.0" y="151" text-anchor="middle" dominant-baseline="central">Proven, candidate or risky</text></g><line class="arr" x1="340" y1="172" x2="340" y2="199" marker-end="url(#a)"/><g class="purple"><rect x="190" y="202" width="300" height="56" rx="8"/><text class="th" x="340.0" y="219" text-anchor="middle" dominant-baseline="central">3. Recheck the latest</text><text class="ts" x="340.0" y="237" text-anchor="middle" dominant-baseline="central">Versions and security news</text></g><line class="arr" x1="340" y1="258" x2="340" y2="285" marker-end="url(#a)"/><g class="purple"><rect x="190" y="288" width="300" height="56" rx="8"/><text class="th" x="340.0" y="305" text-anchor="middle" dominant-baseline="central">4. Suggest improvements</text><text class="ts" x="340.0" y="323" text-anchor="middle" dominant-baseline="central">Best solution, with proof</text></g><line class="arr" x1="340" y1="344" x2="340" y2="371" marker-end="url(#a)"/><g class="amber"><rect x="190" y="374" width="300" height="56" rx="8"/><text class="th" x="340.0" y="391" text-anchor="middle" dominant-baseline="central">5. You approve?</text><text class="ts" x="340.0" y="409" text-anchor="middle" dominant-baseline="central">Rules change only with your OK</text></g><path class="arr" d="M340 430 L340 458 L215 458 L215 481" marker-end="url(#a)"/><path class="arr" d="M340 458 L465 458 L465 481" marker-end="url(#a)"/><text class="ts" x="270" y="446" text-anchor="middle" dominant-baseline="central">Yes</text><text class="ts" x="410" y="446" text-anchor="middle" dominant-baseline="central">No</text><g class="purple"><rect x="110" y="484" width="210" height="56" rx="8"/><text class="th" x="215.0" y="501" text-anchor="middle" dominant-baseline="central">Skill improves</text><text class="ts" x="215.0" y="519" text-anchor="middle" dominant-baseline="central">Changelog updated</text></g><g class="box"><rect x="360" y="484" width="210" height="56" rx="8"/><text class="th" x="465.0" y="501" text-anchor="middle" dominant-baseline="central">Nothing changes</text><text class="ts" x="465.0" y="519" text-anchor="middle" dominant-baseline="central">Reason is saved</text></g><text class="ts" x="340" y="572" text-anchor="middle" dominant-baseline="central">↻ Runs again tomorrow</text></svg>
