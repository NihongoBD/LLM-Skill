<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1160" viewBox="0 0 680 1160" role="img" aria-labelledby="t1"><style>
:root {
  color-scheme: light;
  --bg:#FAF9F5; --surface:#FFFFFF; --border:#B4B2A9; --text:#2C2C2A; --muted:#5F5E5A; --line:#888780;
  --teal-bg:#E1F5EE; --teal-line:#0F6E56; --teal-title:#085041; --teal-sub:#0F6E56;
  --coral-bg:#FAECE7; --coral-line:#993C1D; --coral-title:#712B13; --coral-sub:#993C1D;
  --purple-bg:#EEEDFE; --purple-line:#534AB7; --purple-title:#3C3489; --purple-sub:#534AB7;
  --amber-bg:#FAEEDA; --amber-line:#854F0B; --amber-title:#633806; --amber-sub:#854F0B;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg:#1F1E1D; --surface:#2C2C2A; --border:#5F5E5A; --text:#F1EFE8; --muted:#B4B2A9; --line:#888780;
    --teal-bg:#085041; --teal-line:#5DCAA5; --teal-title:#E1F5EE; --teal-sub:#9FE1CB;
    --coral-bg:#712B13; --coral-line:#F0997B; --coral-title:#FAECE7; --coral-sub:#F5C4B3;
    --purple-bg:#3C3489; --purple-line:#AFA9EC; --purple-title:#EEEDFE; --purple-sub:#CECBF6;
    --amber-bg:#633806; --amber-line:#EF9F27; --amber-title:#FAEEDA; --amber-sub:#FAC775;
  }
}
.th { font-size:14px; font-weight:500; fill:var(--text); }
.ts { font-size:12px; fill:var(--muted); }
.box rect { fill:var(--surface); stroke:var(--border); stroke-width:.8; }
.frame { fill:none; stroke:var(--border); stroke-width:1; stroke-dasharray:5 4; }
.arr { stroke:var(--line); stroke-width:1.2; fill:none; }
marker path { stroke:var(--line); }
.teal rect { fill:var(--teal-bg); stroke:var(--teal-line); stroke-width:.8; } .teal .th { fill:var(--teal-title); } .teal .ts { fill:var(--teal-sub); }
.coral rect { fill:var(--coral-bg); stroke:var(--coral-line); stroke-width:.8; } .coral .th { fill:var(--coral-title); } .coral .ts { fill:var(--coral-sub); }
.purple rect { fill:var(--purple-bg); stroke:var(--purple-line); stroke-width:.8; } .purple .th { fill:var(--purple-title); } .purple .ts { fill:var(--purple-sub); }
.amber rect { fill:var(--amber-bg); stroke:var(--amber-line); stroke-width:.8; } .amber .th { fill:var(--amber-title); } .amber .ts { fill:var(--amber-sub); }
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bg { fill: var(--bg); }
