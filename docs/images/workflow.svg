.0" y="273" text-anchor="middle" dominant-baseline="central">Attendance</text></g><line class="arr" x1="210" y1="290" x2="210" y2="313" marker-end="url(#a)"/><g class="box"><rect x="280" y="238" width="100" height="52" rx="8"/><text class="th" x="330.0" y="255" text-anchor="middle" dominant-baseline="central">Agent 3</text><text class="ts" x="330.0" y="273" text-anchor="middle" dominant-baseline="central">Restaurant</text></g><line class="arr" x1="330" y1="290" x2="330" y2="313" marker-end="url(#a)"/><rect class="frame" x="30" y="316" width="360" height="670" rx="12"/><text class="th" x="52" y="336" text-anchor="start" dominant-baseline="central">Each agent, in its own folder</text><g class="box"><rect x="60" y="356" width="300" height="52" rx="8"/><text class="th" x="210.0" y="373" text-anchor="middle" dominant-baseline="central">1. Research features</text><text class="ts" x="210.0" y="391" text-anchor="middle" dominant-baseline="central">All roles and functions</text></g><line class="arr" x1="210" y1="408" x2="210" y2="423" marker-end="url(#a)"/><g class="box"><rect x="60" y="426" width="300" height="52" rx="8"/><text class="th" x="210.0" y="443" text-anchor="middle" dominant-baseline="central">2. Pick stack</text><text class="ts" x="210.0" y="461" text-anchor="middle" dominant-baseline="central">Latest versions, checked live</text></g><line class="arr" x1="210" y1="478" x2="210" y2="493" marker-end="url(#a)"/><g class="box"><rect x="60" y="496" width="300" height="52" rx="8"/><text class="th" x="210.0" y="513" text-anchor="middle" dominant-baseline="central">3. Create project folder</text><text class="ts" x="210.0" y="531" text-anchor="middle" dominant-baseline="central">Own ports and git repo</text></g><line class="arr" x1="210" y1="548" x2="210" y2="563" marker-end="url(#a)"/><g class="box"><rect x="60" y="566" width="300" height="52" rx="8"/><text class="th" x="210.0" y="583" text-anchor="middle" dominant-baseline="central">4. Write 7 docs</text><text class="t